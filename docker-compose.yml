version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Reverse Proxy
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nextjs:
        condition: service_healthy
      estimator-backend:
        condition: service_healthy
      market-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - portal-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  nextjs:
    build:
      context: ./nextjs-portal
      dockerfile: Dockerfile
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ESTIMATOR_API_URL=${NEXT_PUBLIC_ESTIMATOR_API_URL:-http://localhost/api/v1/estimator}
      - NEXT_PUBLIC_MARKET_API_URL=${NEXT_PUBLIC_MARKET_API_URL:-http://localhost/api/v1/market}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - portal-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Estimator Backend (Python / FastAPI)
  # ─────────────────────────────────────────────────────────────────────────────
  estimator-backend:
    build:
      context: ./estimator-backend
      dockerfile: Dockerfile
    ports:
      - "${ESTIMATOR_PORT:-8001}:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-portal_secret}@postgres:5432/${POSTGRES_DB:-portal_db}
      - ML_SERVICE_URL=http://housing-price-api:8000
      - ML_SERVICE_TIMEOUT_SECONDS=${ML_SERVICE_TIMEOUT_SECONDS:-5}
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      housing-price-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/estimator/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portal-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Market Backend (Java / Spring Boot)
  # ─────────────────────────────────────────────────────────────────────────────
  market-backend:
    build:
      context: ./market-backend
      dockerfile: Dockerfile
    ports:
      - "${MARKET_PORT:-8002}:8002"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-portal_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-portal}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-portal_secret}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - ML_SERVICE_URL=http://housing-price-api:8000
      - ML_SERVICE_TIMEOUT_SECONDS=${ML_SERVICE_TIMEOUT_SECONDS:-5}
      - ML_SERVICE_RETRY_MAX_ATTEMPTS=${ML_SERVICE_RETRY_MAX_ATTEMPTS:-3}
      - ML_SERVICE_RETRY_INITIAL_DELAY_MS=${ML_SERVICE_RETRY_INITIAL_DELAY_MS:-1000}
      - ML_SERVICE_RETRY_MULTIPLIER=${ML_SERVICE_RETRY_MULTIPLIER:-2}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - SERVER_PORT=8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      housing-price-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/api/v1/market/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - portal-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # ML Service (existing housing-price-api)
  # ─────────────────────────────────────────────────────────────────────────────
  housing-price-api:
    build:
      context: ./housing-price-api
      dockerfile: Dockerfile
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - portal-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-portal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-portal_secret}
      - POSTGRES_DB=${POSTGRES_DB:-portal_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - portal-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis Cache
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - portal-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  portal-network:
    driver: bridge
