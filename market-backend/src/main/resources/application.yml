server:
  port: 8002
  servlet:
    context-path: /api/v1/market

spring:
  application:
    name: market-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:housing}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  timeout: 5000
  retry:
    max-attempts: 3
    initial-delay: 1000
    multiplier: 2

market:
  cache:
    ttl-seconds: ${CACHE_TTL:300}
  export:
    max-rows: 50000
    max-records-per-request: 10000
