worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream definitions
    upstream nextjs {
        server nextjs:3000;
    }

    upstream estimator_backend {
        server estimator-backend:8001;
    }

    upstream market_backend {
        server market-backend:8002;
    }

    server {
        listen 80;
        server_name localhost;

        # ─────────────────────────────────────────────────────────────────────
        # Health check endpoint for Nginx itself
        # ─────────────────────────────────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }

        # ─────────────────────────────────────────────────────────────────────
        # Estimator Backend API (Python/FastAPI)
        # Route: /api/v1/estimator/* → FastAPI :8001
        # ─────────────────────────────────────────────────────────────────────
        location /api/v1/estimator/ {
            proxy_pass http://estimator_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }

        # ─────────────────────────────────────────────────────────────────────
        # Market Backend API (Java/Spring Boot)
        # Route: /api/v1/market/* → Spring Boot :8002
        # ─────────────────────────────────────────────────────────────────────
        location /api/v1/market/ {
            proxy_pass http://market_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
        }

        # ─────────────────────────────────────────────────────────────────────
        # Next.js Frontend (catch-all)
        # Route: /* → Next.js :3000
        # ─────────────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }

        # ─────────────────────────────────────────────────────────────────────
        # Static assets caching (Next.js _next/static)
        # ─────────────────────────────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
